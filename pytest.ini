[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    lento: pruebas de volumen o rendimiento (minutos). Omitir con:  pytest -m "not lento"
# un aviso de obsolescencia (como el de httpx) hace fallar la bateria en vez de pasar desapercibido
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
